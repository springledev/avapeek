services:
  # --- Reverse Proxy: Caddy ---
  caddy:
    image: caddy:2.11.7-alpine
    container_name: avapeek_caddy
    restart: unless-stopped
    ports:
      - "88:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Backend: FrankenPHP + Laravel Octane ---
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - storage:/app/storage
      # Read-only view of Garage's data volume so STORAGE_VOLUME_PATH=/garage-data
      # can derive the quota. Empty (harmless) when the garage profile is off.
      - garage_data:/garage-data:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Only present with the "garage" profile (COMPOSE_PROFILES=garage).
      # Needs Docker Compose >= 2.20 for `required: false`.
      garage-init:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Queue Worker (Web Push notifications; harmless when push is off) ---
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek_queue
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - storage:/app/storage
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Scheduler (runs sanctum:prune-expired and other routes/console.php schedules) ---
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek_scheduler
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - storage:/app/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Frontend: Vue SPA via Nginx ---
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: avapeek_frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- PostgreSQL 18 ---
  postgres:
    image: postgres:18.6-alpine
    container_name: avapeek_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Redis 8.2 ---
  redis:
    image: redis:8.2.10-alpine
    container_name: avapeek_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Garage (self-hosted S3-compatible object storage) ---
  garage:
    profiles: ["garage"]
    image: dxflrs/garage:v2.4.1
    container_name: avapeek_garage
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-${GARAGE_RPC_SECRET}}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  # --- Garage provisioning (layout, key, bucket) — idempotent ---
  garage-init:
    profiles: ["garage"]
    build:
      context: .
      dockerfile: docker/garage/Dockerfile
    container_name: avapeek_garage_init
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: photos
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
    depends_on:
      garage:
        condition: service_healthy
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:
  garage_meta:
  garage_data:
  storage:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
