services:
  # --- Reverse Proxy: Caddy ---
  caddy:
    image: caddy:2-alpine
    container_name: avapeek_caddy
    restart: unless-stopped
    ports:
      - "88:80"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Backend: FrankenPHP + Laravel Octane ---
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek_backend
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/up"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # Queue worker is disabled: no jobs are dispatched yet (no ShouldQueue
  # classes or dispatch() calls in backend/app). Re-enable when one is added.
  # # --- Queue Worker ---
  # queue:
  #   build:
  #     context: .
  #     dockerfile: docker/php/Dockerfile
  #   container_name: avapeek_queue
  #   restart: unless-stopped
  #   env_file:
  #     - backend/.env
  #   volumes:
  #     - storage:/app/storage
  #   command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   healthcheck:
  #     test: ["CMD", "php", "artisan", "queue:monitor", "redis:default", "--count=1"]
  #     interval: 60s
  #     timeout: 5s
  #     retries: 3
  #   networks:
  #     - app-network

  # --- Scheduler (runs sanctum:prune-expired and other routes/console.php schedules) ---
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek_scheduler
    restart: unless-stopped
    env_file:
      - backend/.env
    volumes:
      - storage:/app/storage
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- Frontend: Vue SPA via Nginx ---
  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    container_name: avapeek_frontend
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  # --- PostgreSQL 18 ---
  postgres:
    image: postgres:18-alpine
    container_name: avapeek_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- Redis 8.2 ---
  redis:
    image: redis:8.2-alpine
    container_name: avapeek_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- MinIO (S3-compatible object storage) ---
  minio:
    image: minio/minio:latest
    container_name: avapeek_minio
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # --- MinIO bucket provisioning ---
  minio-init:
    image: minio/mc:latest
    container_name: avapeek_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/photos;
      echo 'Buckets created';
      "
    networks:
      - app-network

volumes:
  pgdata:
  redisdata:
  miniodata:
  storage:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
