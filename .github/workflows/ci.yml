name: CI

# Frontend checks (type-check, lint, Vitest) and backend checks (Pint, Pest on
# in-memory SQLite) on pull requests and pushes to master.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: bcmath, gmp, intl, mbstring, pdo_sqlite, sqlite3, zip
          coverage: none
      - id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test --compact

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:unit -- --run

  website:
    # Builds the documentation site; VitePress fails the build on dead links.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run build

  compose-smoke:
    # Builds the production images from source, boots the full stack with the
    # bundled Garage storage and checks health, storage and the SPA through Caddy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: avapeek-smoke
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate env and start the stack (builds from source)
        run: ./up.sh --domain localhost --storage garage --build --yes --skip-check
      - name: Wait for backend /up
        # Caddy only proxies /api/* to the backend (a bare /up would hit the
        # SPA), so probe the endpoint inside the backend container like up.sh.
        run: |
          for _ in $(seq 1 60); do
            if docker compose -f docker-compose.prod.yml exec -T backend wget -q -O /dev/null http://localhost/up; then
              exit 0
            fi
            sleep 2
          done
          echo "health endpoint did not respond within 120s" >&2
          exit 1
      - name: Check object storage
        run: docker compose -f docker-compose.prod.yml exec -T backend php artisan storage:check
      - name: SPA root returns 200
        run: |
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:88/)"
          echo "GET / -> ${status}"
          test "${status}" = "200"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml ps -a; docker compose -f docker-compose.prod.yml logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v --remove-orphans
