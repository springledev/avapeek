services:
  # --- PostgreSQL 18 ---
  postgres:
    image: postgres:18-alpine
    container_name: avapeek-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis 8.2 ---
  redis:
    image: redis:8.2-alpine
    container_name: avapeek-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Garage (self-hosted S3-compatible object storage) ---
  garage:
    profiles: ["garage"]
    image: dxflrs/garage:v2.4.1
    container_name: avapeek-garage
    ports:
      - "3900:3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-${GARAGE_RPC_SECRET}}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Garage provisioning (layout, key, bucket) — idempotent ---
  garage-init:
    profiles: ["garage"]
    build:
      context: .
      dockerfile: docker/garage/Dockerfile
    container_name: avapeek-garage-init
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: photos
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
    depends_on:
      garage:
        condition: service_healthy

  # --- Mailpit (local email catcher) ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: avapeek-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000

  # --- Backend: FrankenPHP with bind mount (hot reload) ---
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    # Override host-based defaults with Docker service names
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      # Defaults target the bundled Garage (COMPOSE_PROFILES=garage). For an
      # external S3 provider set these in the root .env (see docs/storage.md).
      AWS_ENDPOINT: ${AWS_ENDPOINT:-http://garage:3900}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-garage}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-true}
      AWS_TEMPORARY_URL: ${AWS_TEMPORARY_URL-http://localhost:8000}
    volumes:
      - ./backend:/app
      - storage:/app/storage
      - bootstrap_cache:/app/bootstrap/cache
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/Caddyfile:/etc/caddy/Caddyfile:ro
      # Read-only view of Garage's data volume so STORAGE_VOLUME_PATH=/garage-data
      # can derive the quota. Empty (harmless) when the garage profile is off.
      - garage_data:/garage-data:ro
    ports:
      - "8000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Only present with the "garage" profile; needs Docker Compose >= 2.20.
      garage-init:
        condition: service_completed_successfully
        required: false

volumes:
  pg_data:
  redis_data:
  garage_meta:
  garage_data:
  storage:
  bootstrap_cache:
