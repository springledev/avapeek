services:
  # --- PostgreSQL 18 ---
  postgres:
    image: postgres:18-alpine
    container_name: avapeek-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Redis 8.2 ---
  redis:
    image: redis:8.2-alpine
    container_name: avapeek-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO (S3-compatible object storage) ---
  minio:
    image: minio/minio:latest
    container_name: avapeek-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO bucket provisioning ---
  minio-init:
    image: minio/mc:latest
    container_name: avapeek-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/photos;
      echo 'Bucket created';
      "

  # --- Mailpit (local email catcher) ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: avapeek-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000

  # --- Backend: FrankenPHP with bind mount (hot reload) ---
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: avapeek-backend
    restart: unless-stopped
    env_file:
      - backend/.env
    # Override host-based defaults with Docker service names
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:8000
    volumes:
      - ./backend:/app
      - storage:/app/storage
      - bootstrap_cache:/app/bootstrap/cache
      - ./docker/php/opcache.dev.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./docker/php/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "8000:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  pg_data:
  redis_data:
  minio_data:
  storage:
  bootstrap_cache:
