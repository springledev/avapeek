# Single-node Garage configuration for Avapeek.
# Secrets are NOT set here: GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN are
# read from the environment (see docker-compose files).

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "garage:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
