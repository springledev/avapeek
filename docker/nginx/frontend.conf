server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trust the Caddy reverse proxy one hop away
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/manifest+json application/javascript application/xml+rss image/svg+xml;

    # NOTE: add_header is NOT inherited into a location that declares its own
    # add_header, so each location below repeats what it needs.

    # SPA fallback. index.html must always be revalidated so a new deploy is picked up.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # The service worker and manifest must never be served stale,
    # otherwise the SW could never update.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The stock mime.types has no .webmanifest entry, so set the type here.
    # (A server-level `types {}` block would replace the whole inherited table.)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Web Share Target: a POST that reaches nginx (no service worker yet, SW
    # disabled, first launch) is redirected to the upload page instead of a 405.
    # absolute_redirect off keeps the Location relative, so behind Caddy (TLS
    # termination or a port mapping) the scheme and port are not rewritten.
    location = /share-target {
        absolute_redirect off;
        return 303 /upload?shared=1;
    }

    # Hashed build output: immutable for a year.
    # ^~ stops the extension regex below from taking over hashed png/svg/woff2.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Unhashed public/ files (icons, favicon, fonts): revalidate, never immutable.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-cache";
    }
}
